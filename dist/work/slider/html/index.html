<!DOCTYPE html>
<html>
    <head>
        <title>
            Welcome | Home
        </title>

        <!-- script -->
        <script src="../js/script.js"></script>

        <!-- bootstrap script -->
        <script src="../../bs/js/bootstrap.js"></script>

        <!-- stylesheet -->
        <link rel="stylesheet" type="text/css" href="../css/style.css" />

        <!-- bootstrap stylesheet -->
        <link
            rel="stylesheet"
            type="text/css"
            href="../../bs/css/bootstrap.css"
        />

        <!-- font awesome -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
        />
    </head>

    <body>
        <!-- navigation bar  -->
        <nav class="navbar navbar-expand-md bg-dark navbar-dark">
            <!-- Brand -->
            <a class="navbar-brand" href="#">$ Projects/Slider/</a>

            <!-- Toggler/collapsible Button -->
            <button
                class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#collapsibleNavbar"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar links -->
            <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="Login.html">Log In</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="SignUp.html">Sign Up</a>
                    </li>
                </ul>
            </div>
        </nav>

        <div class="container">
            <div id="left"></div>
            <!-- left button -->
            <div
                id="one"
                onclick="change('fourLeft','threeLeft','twoLeft','one','twoRight','threeRight','fourRight')"
            ></div>
            <div
                id="twoRight"
                onclick="change('threeLeft','twoLeft','one','twoRight','threeRight','fourRight','fourLeft')"
            ></div>
            <div
                id="twoLeft"
                onclick="change('fourRight','fourLeft','threeLeft','twoLeft','one','twoRight','threeRight')"
            ></div>
            <div
                id="threeRight"
                onclick="change('twoLeft','one','twoRight','threeRight','fourRight','fourLeft','threeLeft')"
            ></div>
            <div
                id="threeLeft"
                onclick="change('threeRight','fourRight','fourLeft','threeLeft','twoLeft','one','twoRight')"
            ></div>
            <div
                id="fourRight"
                onclick="change('one','twoRight','threeRight','fourRight','fourLeft','threeLeft','twoLeft')"
            ></div>
            <div
                id="fourLeft"
                onclick="change('twoRight','threeRight','fourRight','fourLeft','threeLeft','twoLeft','one')"
            ></div>
            <div id="right"></div>
            <!-- right button -->
        </div>
        <div
            id="mainButton"
            onmouseover="changeButton()"
            onmouseout="changeBack()"
        ></div>
    </body>
</html>
